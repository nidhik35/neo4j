<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add New Patient</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef3fb;
    margin: 0;
  }
  .container {
    width: 90%;
    max-width: 500px;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
  }
  h2 {
    text-align: center;
    color: #2b7bba;
  }
  label { font-weight: bold; margin-top: 12px; display: block; }
  input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #aaa;
  }
  button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    background: #2b7bba;
    color: white;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
  }
  button:hover {
    background: #1a5d8f;
  }
</style>
</head>

<body>

<div class="container">
  <h2>Add New Patient</h2>

  <label>Patient ID</label>
  <input id="patientId" placeholder="p103" />

  <label>Age</label>
  <input id="age" type="number" />

  <label>Gender</label>
  <select id="sex">
    <option value="">Select</option>
    <option value="M">Male</option>
    <option value="F">Female</option>
  </select>

  <label>Notes</label>
  <input id="notes" placeholder="Any notes..." />

  <button id="saveBtn">Save Patient</button>

  <br/><br/>
  <a href="dashboard.html">← Back to Dashboard</a>
</div>

<script>
document.getElementById("saveBtn").addEventListener("click", async () => {
  const patientId = document.getElementById("patientId").value.trim();
  const age = Number(document.getElementById("age").value);
  const sex = document.getElementById("sex").value; // M or F
  const notes = document.getElementById("notes").value.trim();

  if (!patientId || !age || !sex) {
    alert("Please fill all required fields!");
    return;
  }

  try {
    const res = await fetch("http://localhost:3000/addPatient", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ patientId, age, sex, notes })
    });

    const msg = await res.json();

    alert("Patient Added Successfully!");
  } catch (err) {
    alert("Error saving patient!");
    console.error(err);
  }
});
</script>

</body>
</html>
